apiVersion: v1
kind: Service
metadata:
  name: cti-platform-service
  namespace: default
  labels:
    app.kubernetes.io/name: cti-platform
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: cti-platform
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
