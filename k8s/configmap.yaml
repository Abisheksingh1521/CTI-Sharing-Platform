apiVersion: v1
kind: ConfigMap
metadata:
  name: cti-platform-config
  namespace: default
  labels:
    app.kubernetes.io/name: cti-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: threat-intel-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_PATH: "/data/threat_intel.db"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_MAX_REQUESTS: "5"
