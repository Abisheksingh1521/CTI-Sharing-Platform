name: Secure Build & Security Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secure-build:
    name: Phase 14: Secure CI/CD Pipeline & Automated Security Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies (Reproducible Clean Install)
        run: npm ci

      - name: Stage 1: Secret Detection & Anti-Hardcoding Audit
        run: node scripts/detect-secrets.js

      - name: Stage 2: Static Application Security Testing (SAST)
        run: node scripts/security-scan.js

      - name: Stage 3: Dependency Security Vulnerability Audit
        run: npm audit --audit-level=critical || true

      - name: Stage 4: Automated Unit & Integration Testing
        run: npm test

      - name: Stage 5: End-to-End Realistic CTI Workflow Testing
        run: npm run test:e2e

      - name: Stage 6: Security Vulnerability Regression Suite (V01-V06)
        run: npm run test:vuln

      - name: Stage 7: Application-Level Security Fuzz Testing
        run: node scripts/fuzz-security.js

      - name: Stage 8: Cryptographic Audit Hash-Chain Verification
        run: node scripts/verify-audit-chain.js

      - name: Stage 9: Container Hardening & Kubernetes Deployment Validation
        run: node scripts/validate-deployment.js

      - name: Stage 10: Build Artifact Integrity & Reproducibility Seal
        run: node scripts/generate-build-manifest.js

      - name: Archive Build Manifest & Fuzzing Evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-build-artifacts
          path: |
            build-manifest.json
            evidence/fuzz_execution_results.json
